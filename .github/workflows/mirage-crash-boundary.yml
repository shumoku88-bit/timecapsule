name: MirageOS crash boundary

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unix-crash-boundary:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"

      - name: Exercise commit/publication crash boundary
        run: bash tools/check-mirage-unix-crash-boundary
