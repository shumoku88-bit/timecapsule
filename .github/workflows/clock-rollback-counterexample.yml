name: Clock rollback counterexample

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  negative-control:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Require clock rollback counterexample
        run: bash tools/check-clock-rollback-counterexample
